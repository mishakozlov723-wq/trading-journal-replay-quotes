name: Update replay quotes

on:
  schedule:
    # 03:23 UTC = 06:23 Moscow, after the previous UTC day and NY trading close.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'update = fresh completed candles; bootstrap = copy original archive for first release only'
        type: choice
        default: update
        options:
          - update
          - bootstrap

permissions:
  contents: read

concurrency:
  group: replay-quotes-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: retocker
      FIREBASE_QUOTES_SITE: ${{ vars.FIREBASE_QUOTES_SITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check configuration
        run: |
          test -n "$FIREBASE_QUOTES_SITE" || { echo 'Set repository variable FIREBASE_QUOTES_SITE'; exit 1; }
          node tools/configure.mjs
      - run: npm ci
      - run: npm test
      - name: Fetch published history and add completed OANDA candles
        id: quotes
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          MODE: ${{ inputs.mode || 'update' }}
        run: |
          if [ "$MODE" = bootstrap ]; then
            export REPLAY_SOURCE_URL=https://retocker.web.app/replay-data/
            node tools/update.mjs --bootstrap
          else
            export REPLAY_SOURCE_URL="https://$FIREBASE_QUOTES_SITE.web.app/replay-data/"
            node oanda-fetch.mjs
          fi
      - name: Install deployment CLI
        if: steps.quotes.outputs.changed == 'true'
        run: npm install --prefix "$RUNNER_TEMP/replay-firebase-cli" firebase-tools@15.32.1 --no-audit --no-fund
      - name: Publish only the quotes site
        if: steps.quotes.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'Set secret FIREBASE_SERVICE_ACCOUNT_JSON'; exit 1; }
          KEY_FILE="$RUNNER_TEMP/replay-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          "$RUNNER_TEMP/replay-firebase-cli/node_modules/.bin/firebase" deploy --only hosting:quotes --project "$FIREBASE_PROJECT_ID" --non-interactive
