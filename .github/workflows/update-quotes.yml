name: Update replay quotes

on:
  schedule:
    # 06:23 Moscow, with catch-up attempts at 07:23 and 08:23.
    # GitHub may delay/drop a scheduled run; unchanged data is not redeployed.
    - cron: '23 3,4,5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'GER40: check-ger40-2020 verifies only; replace-ger40-2020 publishes. Routine daily mode: update.'
        type: choice
        default: update
        options:
          - update
          - check-ger40-2020
          - replace-ger40-2020
          - backfill-m3
          - bootstrap

permissions:
  contents: read

concurrency:
  group: replay-quotes-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: retocker
      FIREBASE_QUOTES_SITE: ${{ vars.FIREBASE_QUOTES_SITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check configuration
        run: |
          test -n "$FIREBASE_QUOTES_SITE" || { echo 'Set repository variable FIREBASE_QUOTES_SITE'; exit 1; }
          node tools/configure.mjs
      - run: npm ci
      - run: npm test
      # Published files are reused from the Actions cache when their checksum
      # matches meta.json, so the nightly run does not re-download ~190 MB
      # from Firebase Hosting (Spark plan transfer quota).
      - name: Restore cached quote files
        uses: actions/cache@v4
        with:
          path: .quotes-cache
          key: replay-quotes-${{ github.run_id }}
          restore-keys: replay-quotes-
      - name: Fetch published history and add completed OANDA candles
        id: quotes
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          MODE: ${{ inputs.mode || 'update' }}
          NODE_OPTIONS: --max-old-space-size=5120
          QUOTES_CACHE_DIR: ${{ github.workspace }}/.quotes-cache
        run: |
          if [ "$MODE" = bootstrap ]; then
            export REPLAY_SOURCE_URL=https://retocker.web.app/replay-data/
            node tools/update.mjs --bootstrap
          elif [ "$MODE" = check-ger40-2020 ] || [ "$MODE" = replace-ger40-2020 ]; then
            export REPLAY_SOURCE_URL="https://$FIREBASE_QUOTES_SITE.web.app/replay-data/"
            if [ "$MODE" = check-ger40-2020 ]; then
              node oanda-fetch.mjs --replace-ger40 --dry-run
              node tools/audit.mjs oanda-check/replay-data
            else
              node oanda-fetch.mjs --replace-ger40
              node tools/audit.mjs public/replay-data
            fi
          elif [ "$MODE" = backfill-m3 ]; then
            export BACKFILL_M3=true
            export REPLAY_SOURCE_URL="https://$FIREBASE_QUOTES_SITE.web.app/replay-data/"
            node oanda-fetch.mjs
          else
            export REPLAY_SOURCE_URL="https://$FIREBASE_QUOTES_SITE.web.app/replay-data/"
            node oanda-fetch.mjs
          fi
      - name: Install deployment CLI
        if: steps.quotes.outputs.changed == 'true'
        run: npm install --prefix "$RUNNER_TEMP/replay-firebase-cli" firebase-tools@15.32.1 --no-audit --no-fund
      - name: Publish only the quotes site
        if: steps.quotes.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'Set secret FIREBASE_SERVICE_ACCOUNT_JSON'; exit 1; }
          KEY_FILE="$RUNNER_TEMP/replay-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          "$RUNNER_TEMP/replay-firebase-cli/node_modules/.bin/firebase" deploy --only hosting:quotes --project "$FIREBASE_PROJECT_ID" --non-interactive
