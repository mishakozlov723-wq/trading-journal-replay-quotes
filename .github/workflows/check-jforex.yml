name: Check JForex history (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jforex-history-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build official SDK history reader
        run: mvn -B -f jforex-pom.xml compile dependency:copy-dependencies -DoutputDirectory=target/lib
      - name: Prepare completed-day range from published metadata
        id: range
        run: node jforex-check.mjs --prepare
      - name: Read BID history from JForex demo
        env:
          DUKASCOPY_USERNAME: ${{ secrets.DUKASCOPY_USERNAME }}
          DUKASCOPY_PASSWORD: ${{ secrets.DUKASCOPY_PASSWORD }}
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          printf 'log4j.rootLogger=OFF\n' > target/log4j.properties
          java -Djava.awt.headless=true -Dlog4j.configuration=file:target/log4j.properties -cp 'target/classes:target/lib/*' ReplayHistory "$FROM" "$TO" jforex-check
      - name: Verify archive overlap and new candles
        run: node jforex-check.mjs
      - name: Save quote comparison (no credentials or SDK logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jforex-history-comparison
          path: |
            jforex-check/*.csv
            jforex-check/comparison.json
          retention-days: 3
